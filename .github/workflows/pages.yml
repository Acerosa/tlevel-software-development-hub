name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out T Level hub
        uses: actions/checkout@v7
        with:
          path: tlevel-software-development-hub
          fetch-depth: 0

      - name: Check out reviewed Core
        uses: actions/checkout@v7
        with:
          repository: Acerosa/learning-platform-core
          ref: v0.2.26
          path: learning-platform-core

      - name: Check out reviewed Content
        uses: actions/checkout@v7
        with:
          repository: Acerosa/learning-platform-content
          ref: v0.1.4
          path: learning-platform-content

      - name: Check out reviewed UI
        uses: actions/checkout@v7
        with:
          repository: Acerosa/Acerosa-learning-platform-ui
          ref: v0.1.15
          path: learning-platform-ui

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tlevel-software-development-hub/package-lock.json
            learning-platform-ui/package-lock.json

      - name: Install shared UI peer dependencies
        working-directory: learning-platform-ui
        run: npm ci

      - name: Install, test and build
        working-directory: tlevel-software-development-hub
        run: |
          npm ci
          npm test

      - name: Assert Pages artifact is the Vite bundle
        working-directory: tlevel-software-development-hub
        run: |
          test -f dist/index.html
          if grep -E 'src/main\.tsx|main\.tsx' dist/index.html; then
            echo "dist/index.html must not reference TypeScript source" >&2
            exit 1
          fi
          grep -E 'assets/[^"/]+\.js' dist/index.html

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: tlevel-software-development-hub/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out hub
        uses: actions/checkout@v7

      - name: Check out Core health tooling
        uses: actions/checkout@v7
        with:
          repository: Acerosa/learning-platform-core
          ref: v0.2.28
          path: learning-platform-core

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        working-directory: learning-platform-core
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Post-deploy Pages health check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LP_SUPABASE_URL: https://hubwpkrqndorznwzvaer.supabase.co
          LP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          EXPECTED_CURRICULUM_VERSION: ${{ vars.EXPECTED_CURRICULUM_VERSION }}
        run: |
          if [ -z "$LP_SUPABASE_PUBLISHABLE_KEY" ]; then
            LP_SUPABASE_PUBLISHABLE_KEY="sb_publishable_SlcVwn-vjm-hTUZlC_UH7g_V3GedixM"
          fi
          export LP_SUPABASE_PUBLISHABLE_KEY
          node learning-platform-core/dist/deployment-health.mjs \
            --config pages-health.json \
            --require-browser \
            --attempts 8 \
            --delay-ms 15000
